name: Build check

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-wrapper:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Run the wrapper in a child Windows PowerShell 5 process, matching the
      # drag-and-drop entry point used by Build-On-Windows.cmd.
      - name: Check Windows wrapper parameter binding
        shell: pwsh
        run: |
          $missing = Join-Path $env:RUNNER_TEMP "missing-silksong-depot"
          $result = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\Build-On-Windows.ps1 -Depot $missing `
            -ValidatePathsOnly 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "The wrapper failed: $result" }
          if ($result -match "Cannot bind argument.*Path") {
            throw "Build-On-Windows.ps1 still evaluates an empty script path."
          }
          $expected = [System.IO.Path]::GetFullPath((Join-Path $PWD "pc-output"))
          if ($result -notmatch [regex]::Escape("OutputPath=$expected")) {
            throw "The wrapper resolved the wrong default output: $result"
          }

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check desktop builder and shell scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/pc-builder/tests -v
          python3 -m py_compile tools/pc-builder/build.py
          bash -n tools/docker/apk-entrypoint.sh
          bash -n tools/ondevice-il2cpp/build-il2cpp.sh
          bash -n tools/depot-to-apk/build.sh
          git diff --check

      - uses: docker/setup-buildx-action@v3

      # Build the larger Windows/PC target here. It contains the ordinary APK
      # environment too, and proving this stage installs catches an NDK/image
      # regression before somebody downloads several gigabytes on Windows.
      - name: Build the PC image
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file: tools/docker/apk.Dockerfile
          target: pc
          platforms: linux/amd64
          tags: silksong-pc-builder:check
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify bundle signing inside the PC image
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint python3 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            silksong-pc-builder:check \
            -m unittest discover -s tools/pc-builder/tests -v

      - name: Cache build inputs
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/unity-player
            .ci-cache/gradle
            .ci-cache/nuget
            .ci-cache/build
          key: check-${{ hashFiles('tools/ondevice-il2cpp/fetch-unity.sh', 'src/SilksongLauncher.Launcher/**/*.kts') }}-${{ github.sha }}
          restore-keys: |
            check-${{ hashFiles('tools/ondevice-il2cpp/fetch-unity.sh', 'src/SilksongLauncher.Launcher/**/*.kts') }}-
            check-

      - name: Smoke-test desktop IL2CPP conversion
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/unity-player
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/unity-player:/opt/unity-player" \
            silksong-pc-builder:check il2cpp-smoke

      - name: Compile APK and Android tests
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/{unity-player,gradle,nuget,build}
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/unity-player:/opt/unity-player" \
            -v "$PWD/.ci-cache/gradle:/gradle" \
            -v "$PWD/.ci-cache/nuget:/root/.nuget/packages" \
            -v "$PWD/.ci-cache/build:/root/.cache/silksong" \
            -e GRADLE_DAEMON=0 \
            -e DEBUGGABLE=0 \
            -e RUN_TESTS=1 \
            silksong-pc-builder:check apk
          sudo chown -R "$(id -u):$(id -g)" .ci-cache build
